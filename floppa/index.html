        @keyframes buttonanim 
        {
            0%  
            {
                 transform: scale(1); 
            }
            25%  
            { 
                transform: scale(0.91);
            }
            50%  
            { 
                transform: scale(1); 
            }
            75%  
            { 
                transform: scale(0.91); 
            }
            100% 
            { 
                transform: scale(1); 
            }
        }



        .thegoodstuff 
        {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
    
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000000;
            font-family: Arial, sans-serif;
            color: white;
        }

        .floppa
        {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            animation: buttonanim 5s ease-in-out infinite;
            visibility: hidden;
            z-index: 10;
        }

        .floppa
        {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            z-index: 10;
        }

    
   
        #background 
        {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
            opacity: 0.3;
            visibility: hidden;
        }

</head>

    <audio id="background-music" loop autoplay muted>
        <source src="floppa.mp3" type="audio/mp3">

        <div class="floppa" id="floppa">

</body>

<script>
    const bgmusic = document.getElementById("background-music");
    const meow = document.getElementById("meow");
    const floppa = document.getElementById("floppa");
    const overlay = document.getElementById("overlay");
    const bg = document.getElementById("background");
    let score = 0;
    
    window.addEventListener("click", playthjestuff);
    function meoww()
    {
        meow.play();

        score++;
        document.getElementById("s").textContent = score.toString();
    }

    function playthjestuff()
    {
        bgmusic.muted = false;
        bgmusic.volume = 0.8;
        bgmusic.play();
        floppa.style.visibility = "visible";
        bg.style.visibility = "visible";
        overlay.style.visibility = "hidden";
        window.removeEventListener("click", playthjestuff);
        window.addEventListener("click", meoww);
    }
    window.addEventListener("click", playthjestuff);

    

</script>
