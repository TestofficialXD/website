<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>serversided.win</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #0b0e1a;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .title {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .title h1 {
            margin: 0;
            margin-right: 15px;
            font-size: 36px;
        }

        .title img {
            width: 48px;
            height: 48px;
        }

        .buttons {
            display: flex;
            gap: 20px;
        }

        .buttons a {
            text-decoration: none;
        }

        .buttons button {
            width: 160px;
            height: 50px;
            background-color: #1b1f3a;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
        }

        .buttons button:hover {
            background-color: #262b55;
        }

        .footer {
            position: fixed;
            bottom: 10px;
            font-size: 11px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            <h1>serversided.win</h1>
            <img src="cat.gif" alt="gif">
        </div>

        <div class="buttons">
            <a href="https://serversided.win/wyndigo">
                <button>Wyndigo Mod Menu</button>
            </a>
            <a href="https://serversided.win/bio">
                <button>tests profile</button>
            </a>
        </div>
    </div>

    <div class="footer">made by @testofficialxd</div>
</body>
</html>
