<!DOCTYPE html>

    <style>
    /* hello coded readers, some of this code i got from css and html code generators like: https://webcode.tools because idk how to code in css n shit but im learning. */

    @keyframes buttonanim {
        0%  
        {
             transform: scale(1); 
        }
        25%  
        { 
            transform: scale(0.95);
        }
        50%  
        { 
            transform: scale(0.98); 
        }
        75%  
        { 
            transform: scale(0.93); 
        }
        100% 
        { 
            transform: scale(1); 
        }
    }

    @keyframes bounceee {
	    0% {
	    	animation-timing-function: ease-in;
	    	opacity: 1;
	    	transform: translateY(-500px);
	    }

	    24% {
	    	opacity: 1;
	    }

	    40% {
	    	animation-timing-function: ease-in;
	    	transform: translateY(-100px);
	    }

	    65% {
	    	animation-timing-function: ease-in;
	    	transform: translateY(-50px);
	    }

	    82% {
	    	animation-timing-function: ease-in;
	    	transform: translateY(-10px);
	    }

	    93% {
	    	animation-timing-function: ease-in;
	    	transform: translateY(-5px);
	    }

	    25%,
	    55%,
	    75%,
	    87% {
	    	animation-timing-function: ease-out;
	    	transform: translateY(0px);
	    }

	    100% {
	    	animation-timing-function: ease-out;
	    	opacity: 1;
	    	transform: translateY(0px);
	    }
    }


    @keyframes bounce2 {
	    0% {
	    	animation-timing-function: ease-in;
	    	opacity: 1;
	    	transform: translateY(500px);
	    }

	    24% {
	    	opacity: 1;
	    }

	    40% {
	    	animation-timing-function: ease-in;
	    	transform: translateY(100px);
	    }

	    65% {
	    	animation-timing-function: ease-in;
	    	transform: translateY(50px);
	    }

	    82% {
	    	animation-timing-function: ease-in;
	    	transform: translateY(10px);
	    }

	    93% {
	    	animation-timing-function: ease-in;
	    	transform: translateY(5px);
	    }

	    25%,

	    55%,

	    75%,
        
	    87% {
	    	animation-timing-function: ease-out;
	    	transform: translateY(0px);
	    }

	    100% {
	    	animation-timing-function: ease-out;
	    	opacity: 1;
	    	transform: translateY(0px);
	    }
    }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #090c16;
            font-family: Arial, sans-serif;
            color: white;
        }

        .thegoodstuff {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .title {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .title h1 {
            margin: 0;
            margin-right: 16px;
            font-size: 36px;
            animation: bounceee 2s ease 0s 1 normal forwards;
        }

        .title img {
            width: 50px;
            height: 50px;
            animation: bounceee 2s ease 0s 1 normal forwards;
        }

        .buttons {
            display: flex;
            gap: 20px;
        }

        .buttons a {
            text-decoration: none;
        }

        .buttons button {
            width: 160px;
            height: 50px;
            background-color: #1b1f3a;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            animation: buttonanim 5s ease-in-out infinite;

        }

        .buttons button:hover {
            background-color: #262b55;
        }

        .footer {
            position: fixed;
            bottom: 10px;
            font-size: 11px;
            opacity: 0.6;
        }

    </style>
